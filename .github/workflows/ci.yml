name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build
        env:
          AUTH_SECRET: ci-build-secret
          AUTH_ALLOW_DEV_LOGIN: "true"
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: npm run build
